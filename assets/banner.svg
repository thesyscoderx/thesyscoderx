<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Pruthviraj Sonawane - Engineering notebook</title>
  <desc id="description">A colorful animated engineering notebook: Engineering with curiosity and intent. A terminal shows a learning workflow, with gently moving violet and teal light and a flowing connection. Motion stops when reduced motion is requested.</desc>
  <style>
    /* Animate decoration only; all meaningful text stays readable without motion. */
    .aurora { animation: drift 16s ease-in-out infinite alternate; }
    .aurora-secondary { animation: drift 19s ease-in-out infinite alternate-reverse; }
    .signal { stroke-dasharray: 8 18; animation: flow 5s linear infinite; }
    .orbit { transform-box: fill-box; transform-origin: center; animation: turn 48s linear infinite; }
    .cursor { animation: blink 1.6s step-end infinite; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(26px, -14px); } }
    @keyframes flow { to { stroke-dashoffset: -104; } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    /* Keep a complete static composition for visitors who prefer less motion. */
    @media (prefers-reduced-motion: reduce) {
      .aurora, .aurora-secondary, .signal, .orbit, .cursor { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#171334"/>
      <stop offset="1" stop-color="#082f3a"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="0.8" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="stream" href="#spectrum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"/>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c4b5fd" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="430" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#background)"/>
    <ellipse class="aurora" cx="430" cy="60" rx="490" ry="300" fill="url(#violet)"/>
    <ellipse class="aurora-secondary" cx="1040" cy="360" rx="440" ry="320" fill="url(#teal)"/>
    <rect width="1200" height="430" fill="url(#dots)"/>
    <circle class="orbit" cx="1120" cy="80" r="116" fill="none" stroke="#c4b5fd" stroke-opacity="0.15" stroke-dasharray="3 15"/>
    <path d="M0 375 H1200" stroke="#a5b4fc" stroke-opacity="0.12"/>
    <path class="signal" d="M0 375 H1200" stroke="url(#stream)" stroke-width="2" fill="none"/>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#475569"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="44" y="32" width="146" height="28" rx="14" fill="#312e81" stroke="#818cf8"/>
    <text x="117" y="51" text-anchor="middle" fill="#e0e7ff" font-size="12" letter-spacing="1.5">THESYSCODERX</text>
    <text x="208" y="51" fill="#cbd5e1" font-size="12" letter-spacing="1.5">PRUTHVIRAJ SONAWANE</text>
    <text x="1148" y="51" text-anchor="end" fill="#a5f3fc" font-size="12" letter-spacing="1.5">LEARN / BUILD / REFINE</text>
    <text x="48" y="402" fill="#cbd5e1" font-size="12" letter-spacing="1.5">AN ENGINEERING NOTEBOOK, NOT A FINISH LINE.</text>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" letter-spacing="-2">
    <text x="44" y="157" fill="#f8fafc" font-size="59">Engineering with</text>
    <text x="44" y="230" fill="url(#spectrum)" font-size="59">curiosity &amp; intent.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">
    <rect x="48" y="279" width="165" height="32" rx="8" fill="#083344" stroke="#22d3ee"/>
    <text x="130" y="300" text-anchor="middle" fill="#cffafe">BACKEND SYSTEMS</text>
    <rect x="225" y="279" width="133" height="32" rx="8" fill="#2e1065" stroke="#a78bfa"/>
    <text x="291" y="300" text-anchor="middle" fill="#ede9fe">AUTOMATION</text>
    <rect x="370" y="279" width="143" height="32" rx="8" fill="#4a1942" stroke="#f472b6"/>
    <text x="441" y="300" text-anchor="middle" fill="#fce7f3">RELIABILITY</text>
  </g>
  <g transform="translate(762 99)">
    <rect x="0" y="0" width="390" height="239" rx="16" fill="#080f24" stroke="#64748b"/>
    <path d="M1 43 H389" stroke="#334155"/>
    <circle cx="24" cy="23" r="5" fill="#fb7185"/>
    <circle cx="43" cy="23" r="5" fill="#fbbf24"/>
    <circle cx="62" cy="23" r="5" fill="#34d399"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="365" y="28" text-anchor="end" fill="#cbd5e1" font-size="12">HOW I WORK</text>
      <text x="24" y="82" fill="#67e8f9">01</text>
      <text x="60" y="82" fill="#e2e8f0">Understand the system.</text>
      <text x="24" y="120" fill="#c4b5fd">02</text>
      <text x="60" y="120" fill="#e2e8f0">Build the small example.</text>
      <text x="24" y="158" fill="#f9a8d4">03</text>
      <text x="60" y="158" fill="#e2e8f0">Connect the pieces.</text>
      <text x="24" y="204" fill="#5eead4">&gt;</text>
      <text x="46" y="204" fill="#5eead4">Keep refining.</text>
      <rect class="cursor" x="182" y="191" width="8" height="16" rx="1" fill="#5eead4"/>
    </g>
  </g>
</svg>
